<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>刮刮乐战报查询</title>
  <script src="/nte/static/captcha/captchas/c/js/jquery.js?v={{ version }}"></script>
  <script src="/nte/static/captcha/captchas/c/js/mCaptcha.min.js?v={{ version }}"></script>
  <script>window.__NTE_AUTH__ = "{{ auth }}";</script>
  <script src="/nte/static/captcha/captchas/c/js/mCaptcha_proxy.js?v={{ version }}"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #101828 0%, #1e293b 100%);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1b2537;
      border-radius: 18px;
      padding: 28px 24px 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    h2 { color: #fff; font-size: 22px; margin-bottom: 6px; }
    .tip { color: #94a3b8; font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    .tip b { color: #f59e0b; }
    input {
      width: 100%;
      height: 46px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      padding: 0 14px;
      outline: none;
      margin-bottom: 12px;
    }
    input::placeholder { color: #64748b; }
    #sliderImgBox { margin-bottom: 12px; }
    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    #queryBtn { background: #f59e0b; color: #1e293b; }
    #queryBtn:disabled { opacity: 0.55; cursor: not-allowed; }
    #status { min-height: 20px; font-size: 13px; text-align: center; margin-top: 4px; }
    #status.ok { color: #34d399; }
    #status.err { color: #f87171; }
    .canvasMsg .code_mistake {
      display: inline-block; color: #fff; background: rgba(220, 38, 38, 0.85);
      padding: 5px 12px; border-radius: 6px; font-size: 16px; margin-top: 4px;
    }
    .canvasMsg .code_ok {
      display: inline-block; color: #fff; background: rgba(16, 185, 129, 0.9);
      padding: 5px 12px; border-radius: 6px; font-size: 16px; margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>刮刮乐战报查询</h2>
    <p class="tip">拖完滑块会自动查询（默认最近 <b>60</b> 天），战报会自动发送到你的 QQ。</p>
    <input id="days" type="number" placeholder="查询天数（1-60，默认 60）" min="1" max="60" value="60">
    <div id="sliderImgBox"></div>
    <p class="tip" style="margin:0 0 12px;font-size:12px;">对准拼图缺口位置再松手；没对准会提示重试，也可点右上角刷新换一张。</p>
    <button id="queryBtn" disabled>请先完成滑块验证</button>
    <p id="status"></p>
    <p id="diag" style="min-height:14px;font-size:11px;color:#64748b;text-align:center;word-break:break-all;"></p>
  </div>

  <script>
    var AUTH = "{{ auth }}";
    var state = { capTicket: "", capAppId: "20003", mCaptcha: null };
    var autoQueried = false;
    var pollTimer = null;
    var $id = function (id) { return document.getElementById(id); };

    function diag(msg) {
      var el = $id("diag");
      if (el) el.textContent = msg;
    }
    window.onerror = function (msg, src, line, col, err) {
      diag("JS错误: " + msg + " @" + (line || "") + ":" + (col || ""));
    };
    window.addEventListener("unhandledrejection", function (e) {
      diag("异步错误: " + ((e.reason && e.reason.message) || e.reason || "unknown"));
    });

    function show(msg, ok) {
      var el = $id("status");
      el.textContent = msg;
      el.className = ok ? "ok" : "err";
    }

    async function post(path, body) {
      try {
        var r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        return await r.json();
      } catch (e) {
        return { ok: false, msg: "网络异常，请稍后重试" };
      }
    }

    function getSecCode() {
      if (!state.mCaptcha) { show("验证码组件尚未就绪，请稍候", false); return null; }
      var code = state.mCaptcha.getValidateResult();
      if (!code) { show("请先完成滑块/点选验证", false); return null; }
      return code;
    }

    function buildCaptcha() {
      try {
        $id("sliderImgBox").innerHTML = "";
        state.mCaptcha = new MCaptcha({ containerId: "sliderImgBox" });
        state.mCaptcha.init({
          appId: "20003",
          capTicket: state.capTicket,
          capType: "embed",
          bindBtn: "",
          onError: function (msg) { diag("验证码错误: " + msg); },
          initCallback: function (failed) {
            // 移动版组件默认隐藏，加载完成后需要主动 show() 才会显示
            if (!failed && state.mCaptcha) {
              try { state.mCaptcha.show(); } catch (e) {}
            } else if (failed) {
              diag("验证码加载失败");
            }
          },
          onRefresh: function () {
            autoQueried = false;
            $id("queryBtn").disabled = false;
            $id("queryBtn").textContent = "请先完成滑块验证";
            show("", true);
          }
        });
        diag("验证码组件已初始化");
        return true;
      } catch (e) {
        diag("组件初始化异常: " + e.message);
        return false;
      }
    }

    async function refreshCaptcha() {
      var d = await post("/nte/scratch/queryCapTicket", { auth: AUTH });
      if (!d.ok) { show(d.msg || "刷新失败，请刷新页面", false); return; }
      state.capTicket = d.capTicket;
      state.capAppId = d.capAppId;
      autoQueried = false;
      $id("queryBtn").disabled = false;
      $id("queryBtn").textContent = "请先完成滑块验证";
      if (!buildCaptcha()) show("验证码组件刷新失败，请刷新页面", false);
    }

    async function init() {
      var d = await post("/nte/scratch/queryCapTicket", { auth: AUTH });
      if (!d.ok) { show(d.msg || "初始化失败", false); return; }
      state.capTicket = d.capTicket;
      state.capAppId = d.capAppId;
      if (!buildCaptcha()) { show("验证码组件加载失败，请刷新页面", false); return; }
      $id("queryBtn").disabled = false;
      // 滑块验证通过后自动触发查询，无需再点按钮
      pollTimer = setInterval(function () {
        if (autoQueried || !state.mCaptcha) return;
        var sec = state.mCaptcha.getValidateResult();
        if (sec) {
          autoQueried = true;
          $id("queryBtn").click();
        }
      }, 250);
      // 把验证码组件的成功/失败提示同步到页面状态栏
      setInterval(function () {
        var msg = document.querySelector(".canvasMsg .code_mistake, .canvasMsg .code_ok");
        if (msg) {
          var t = msg.textContent || "";
          if (t.indexOf("通过") >= 0) show("验证通过，正在查询...", true);
          else if (t.indexOf("错误") >= 0) show("没对准缺口，请再试一次", false);
        }
      }, 600);
      var lastBtnLeft = null;
      var dragSeen = false;
      setInterval(function () {
        var btn = document.querySelector(".canvasSlidBtn");
        if (btn) {
          var left = Math.round(btn.getBoundingClientRect().x);
          if (lastBtnLeft !== null && Math.abs(left - lastBtnLeft) > 8) dragSeen = true;
          lastBtnLeft = left;
        }
      }, 300);
      setInterval(function () {
        var proxy = window.__PROXY_LOG__ ? window.__PROXY_LOG__.join(",") : "";
        diag("代理:[" + (proxy || "无") + "] 拖:" + (dragSeen ? "✓" : "×") + " 子元素:" + $id("sliderImgBox").children.length);
      }, 1500);
    }

    function showDone() {
      if (pollTimer) clearInterval(pollTimer);
      $id("card").innerHTML =
        '<h2>✅ 查询完成</h2>' +
        '<p class="tip">战报已发送到你的 QQ，本页面可以关闭了。</p>' +
        '<button id="closeBtn" style="background:#f59e0b;color:#1e293b;">关闭页面</button>';
      $id("closeBtn").onclick = function () { window.close(); };
      setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
    }

    $id("queryBtn").onclick = async function () {
      var sec = getSecCode();
      if (!sec) return;
      var days = parseInt($id("days").value, 10);
      if (isNaN(days) || days < 1 || days > 60) days = 60;
      var btn = $id("queryBtn");
      btn.disabled = true;
      btn.textContent = "查询中，请稍候...";
      var d = await post("/nte/scratch/doQuery", {
        auth: AUTH, capTicket: state.capTicket, secCode: sec, days: days
      });
      if (d.ok) { showDone(); return; }
      show(d.msg || d.error, d.ok);
      btn.textContent = "请先完成滑块验证";
      btn.disabled = false;
      if (!d.ok) autoQueried = false;
      refreshCaptcha();
    };

    init();
  </script>
</body>
</html>
